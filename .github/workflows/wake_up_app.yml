name: Keep Streamlit App Awake

on:
  schedule:
    # Streamlit Community Cloud hibernates apps after 12 hours without traffic.
    # Run every 6 hours and avoid minute 0, where GitHub Actions is often busy.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: keep-streamlit-app-awake
  cancel-in-progress: false

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install wake-up dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: https://xai-caregiver-support.streamlit.app/
        run: python .github/scripts/wake_up_app.py

      - name: Upload wake-up logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wake-up-logs-${{ github.run_number }}
          path: .github/logs/
          retention-days: 7
